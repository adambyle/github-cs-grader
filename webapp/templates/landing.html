{% extends "base.html" %}
{% block content %}
<section class="landing">
  <h1>coursekit</h1>
  <p>Assignments as private GitHub repositories, with feedback on every push.</p>
  <div class="choices">
    <a class="button" href="{{ url_for('auth.login', as='student', next=next) }}">Sign in as a student</a>
    <a class="button" href="{{ url_for('auth.login', as='instructor', next=next) }}">Sign in as an instructor</a>
  </div>
  <p class="muted">You sign in with your GitHub account. You can switch between student and instructor afterwards.</p>
</section>
{% endblock %}
